    <p><span>Del 9</span> - løkker.</p>
    <p>if setninger ble brukt her:</p>
    <p id="resultat9"></p>
    <br />

    <p>her ble substring brukt:</p>
    <p id="resultat9_1"></p>
    <br />

    <p>her ble håkons metode brukt:</p>
    <p id="resultat9_2"></p>
    <script>
      const res9 = document.querySelector("#resultat9");
      let teller9 = "";
      for (let i = 10; i >= 1; i--) {
        if (i > 1) {
          teller9 = teller9 + i + ", ";
        } else if (i == 1) {
          teller9 = teller9 + i;
        }
        res9.innerHTML = teller9;
      }

      /*Substring metode | enklest*/
      const res9_1 = document.querySelector("#resultat9_1");
      let teller9_1 = "";
      for (let i = 10; i >= 1; i--) {
        teller9_1 = teller9_1 + i + ", ";
      }
      teller9_1 = teller9_1.substring(0, teller9_1.length - 2);
      res9_1.innerHTML = teller9_1;

      /*Håkons METODE*/
      const res9_2 = document.querySelector("#resultat9_2");
      let teller9_2 = "";
      for (let i = 10; i >= 1; i--) {
        teller9_2 += i;
        if (i > 1) teller9_2 += ", ";
        res9_2.innerHTML = teller9_2;
      }
    </script>

    <p>sorterings funksjon:</p>
    <script>
      //BUBBLE SORT??

      /*
      Målet er å få resultatet:
      1,
      3,
      5,
      8,
      12
      */
      // Bruk to løkker.

      // Sammenlign hvert tall med alle de andre tallene.
      const tall_9_7 = [8, 3, 12, 1, 5];
      //nested loop ahhhh O(1) be like type shiii
      for (let i = 0; i < tall_9_7.length; i++) {
        for (let j = 0; j < tall_9_7.length; j++) {
          if (tall_9_7[i] < tall_9_7[j]) {
            let temp = tall_9_7[i];
            tall_9_7[i] = tall_9_7[j];
            tall_9_7[j] = temp;
            console.log(tall_9_7);
          }
        }
      }

      /*
    Refleksjon 

    --Svar på spørsmålene! 

    Hvorfor trenger vi to løkker?
      - for å ha to verdier som vi kan sjekke om er lik hverandre samtidig
    
    Hva gjør variabelen temp? 
      - den er til å ta vare på den ene verdien midlertidig mens jeg bytter plass på to elemente
    Hva skjer hvis vi bytter < til > i if-setningen? 
      - da sorterer vi den fra minst it størst (ved størst til minst i index rekkefølge)
    Hvor mange sammenligninger må programmet gjøre når arrayet har 5 tall?

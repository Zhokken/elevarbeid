    <h1>10.5 - lag brukernavn</h1>
    <script>
        function lagBrukernavn(fornavn, etternavn){
            return fornavn[0].toLowerCase() + fornavn[1].toLowerCase() + etternavn[0].toLowerCase() + etternavn[1].toLowerCase();
        }
        let fornavn101 = "Lisa";
        let etternavn101 = "Presley";
        console.log(lagBrukernavn(fornavn101, etternavn101));
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funksjoner i js</title>
    <style>
      body {
        background-color: beige;
      }

      h1 {
        color: darkcyan;
      }

      input,
      button,
      p {
        padding: 5px;
        margin: 5px;
      }
      p {
        font-size: 1.2em;
      }
    </style>
</head>
<body>
    <h1>1 - din første funksjon</h1>
    <script>
        function siHei(){
            console.log("Hei!")
        } siHei();
    </script>
    <p>Se console.</p>

    <!--|||||||||||||||||||||||-->
    <!--|||||||||||||||||||||||-->

    <h1>2 - kjør funksjonen</h1>
    <script>
        function siHeiVerden(){
            console.log("Hei verden!")
        } 
        for(i = 0; i < 3; i++){
            siHeiVerden();
        }
    </script>
    <p>Se console.</p>

    <!--|||||||||||||||||||||||-->

</body>
</html>
